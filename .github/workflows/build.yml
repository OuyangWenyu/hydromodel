name: build

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macOS-latest]
                python-version: ["3.10", "3.11", "3.12"]
                exclude:
                  # Skip some combinations to reduce CI time
                  - os: windows-latest
                    python-version: "3.10"
                  - os: macOS-latest
                    python-version: "3.10"

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"

            - name: Setup Python and create virtual environment
              run: |
                  uv python install ${{ matrix.python-version }}
                  uv venv



            - name: Clean old uv cache and env (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                Write-Host "Cleaning old uv cache and virtual environments (Windows)..."
                try { uv cache clean } catch { Write-Host "cache clean failed - continuing..." }
                Remove-Item -LiteralPath .venv -Recurse -Force -ErrorAction SilentlyContinue
                Remove-Item -LiteralPath uv.lock -Force -ErrorAction SilentlyContinue

            - name: Clean old uv cache and env (Linux/macOS)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                echo "Cleaning old uv cache and virtual environments (Unix)..."
                uv cache clean || true
                rm -rf .venv || true
                rm -f uv.lock || true

            - name: Install dependencies
              run: |
                  # CI: install hydrodataset/hydrodatasource from PyPI
                  # instead of local editable paths (dev-only).
                  python -c "import io,re; p='pyproject.toml'; s=io.open(p,encoding='utf-8').read(); s=re.sub(r'^hydrodatasource = .*$', '# hydrodatasource = <PyPI in CI>', s, flags=re.M); s=re.sub(r'^hydrodataset = .*$', '# hydrodataset = <PyPI in CI>', s, flags=re.M); io.open(p,'w',encoding='utf-8').write(s)"
                  uv sync --all-extras

            - name: Create hydro_setting.yml (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  echo 'storage:' > hydro_setting.yml
                  echo '  default_source: local' >> hydro_setting.yml
                  echo '  local:' >> hydro_setting.yml
                  echo '    root: /home/runner/.cache/' >> hydro_setting.yml
                  echo '  cache: /home/runner/.cache/' >> hydro_setting.yml
                  sudo cp hydro_setting.yml /home/runner/hydro_setting.yml

            - name: Create hydro_setting.yml (macOS)
              if: matrix.os == 'macOS-latest'
              run: |
                  echo 'storage:' > hydro_setting.yml
                  echo '  default_source: local' >> hydro_setting.yml
                  echo '  local:' >> hydro_setting.yml
                  echo '    root: /Users/runner/.cache/' >> hydro_setting.yml
                  echo '  cache: /Users/runner/.cache/' >> hydro_setting.yml
                  sudo cp hydro_setting.yml /Users/runner/hydro_setting.yml

            - name: Create hydro_setting.yml (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  echo 'storage:' > hydro_setting.yml
                  echo '  default_source: local' >> hydro_setting.yml
                  echo '  local:' >> hydro_setting.yml
                  echo '    root: C:\Users\runneradmin\.cache\' >> hydro_setting.yml
                  echo '  cache: C:\Users\runneradmin\.cache\' >> hydro_setting.yml
                  copy hydro_setting.yml C:\Users\runneradmin\hydro_setting.yml

            - name: Run tests
              run: |
                  uv run pytest -q -p no:cacheprovider
