name: docs
on:
    push:
        branches:
            - main
            - master
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
            - name: Setup Python
              run: uv python install 3.11
            - name: Install dependencies
              run: |
                  python -c "import io,re; p='pyproject.toml'; s=io.open(p,encoding='utf-8').read(); s=re.sub(r'^hydrodatasource = .*$', '# hydrodatasource = <PyPI in CI>', s, flags=re.M); s=re.sub(r'^hydrodataset = .*$', '# hydrodataset = <PyPI in CI>', s, flags=re.M); io.open(p,'w',encoding='utf-8').write(s)"
                  uv sync --all-extras
            - name: Deploy documentation
              run: uv run mkdocs gh-deploy --force
