# Example configuration for XAJ calibration with unified data resolution.

data_cfgs:
  dataset: camels_us
  source: local
  basin_ids: ["12025000"]
  warmup_length: 365
  variables:
    - prcp
    - PET
    - dayl
    - srad
    - tmax
    - tmin
    - vp
    - streamflow
  train_period: ["1981-01-01", "2004-12-31"]
  valid_period: ["2005-01-01", "2009-12-31"]
  test_period: ["2010-01-01", "2014-12-31"]

model_cfgs:
  name: xaj
  params:
    source_type: sources
    source_book: HF
    kernel_size: 15
  output_variable: qsim

training_cfgs:
  algorithm: SCE_UA
  SCE_UA:
    rep: 1000
    ngs: 1000
    kstop: 500
    peps: 0.1
    pcento: 0.1
    random_seed: 1234
  GA:
    pop_size: 40
    n_generations: 20
    cx_prob: 0.7
    mut_prob: 0.2
    random_seed: 1234
  scipy:
    method: SLSQP
    max_iterations: 500
  loss: RMSE
  output_dir: results/12025000
  save_config: true

evaluation_cfgs:
  metrics: ["NSE", "RMSE", "KGE", "PBIAS"]
  save_results: true
  plot_results: true
  validation_split: 0.2
  bootstrap_samples: null
