# Example configuration for XAJ simulation with unified data resolution.

data_cfgs:
  dataset: camels_us
  source: local
  basin_ids:
    - "01013500"
  train_period:
    - "1985-10-01"
    - "1995-09-30"
  valid_period:
    - "1995-10-01"
    - "2005-09-30"
  test_period:
    - "2005-10-01"
    - "2014-09-30"
  variables:
    - precipitation
    - potential_evapotranspiration
    - streamflow
  warmup_length: 365

model_cfgs:
  name: xaj_mz
  params:
    source_type: sources
    source_book: HF
    kernel_size: 15
