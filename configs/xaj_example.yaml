# XAJ calibration example using unified data resolution.

data_cfgs:
  dataset: songliao_event
  source: local
  basin_ids: ["basin_001", "basin_002"]
  warmup_length: 365
  variables:
    - precipitation
    - potential_evapotranspiration
    - streamflow
  train_period: ["2014-10-01", "2019-09-30"]
  test_period: ["2019-10-01", "2021-09-30"]

model_cfgs:
  name: xaj_mz
  params:
    source_type: sources
    source_book: HF
    kernel_size: 15

training_cfgs:
  algorithm: SCE_UA
  SCE_UA:
    rep: 5000
    ngs: 1000
  loss: RMSE
  output_dir: results
  experiment_name: xaj_calibration_test
  param_range_file: null
  random_seed: 1234

evaluation_cfgs:
  metrics: ["NSE", "RMSE", "KGE"]
  save_results: true
  plot_results: true
